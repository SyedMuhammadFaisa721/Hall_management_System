{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}HallMaster Invoice{% endblock %}</title>
	<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
	<link rel="stylesheet" href="{% static 'css/hallmaster.css' %}?v=24">
	{% block page_scripts %}{% endblock %}
	<style>
		body { padding: 24px; }
		.invoice-page { padding: 0; }
		@media (max-width: 700px) { body { padding: 10px; } }
		@media print { body { padding: 0; background: #fff; } }
	</style>
</head>
<body>
	<main>{% block page_content %}{% endblock %}</main>
</body>
</html>
